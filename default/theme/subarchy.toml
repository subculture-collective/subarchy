# Pult profile (ADR 0037): the default theme for a new user. The
# installer runs `pult apply -profile` on this file; `pult apply` with
# it again puts the theme back after an experiment. Apps are not listed, so
# every registered app that is installed is themed. Fonts stay with
# fontconfig's roles (`subcult font`), not with the profile.
schema = 1
theme = "subcult-minimal.json"
