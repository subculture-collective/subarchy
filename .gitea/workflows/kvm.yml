name: kvm

on:
  push:
    branches: [main]

permissions:
  contents: read

# Main runs queue rather than cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  smoke:
    runs-on: subarchy-kvm
    timeout-minutes: 10
    steps:
      - name: Check disk reserve
        run: |
          df -h /
          test "$(df -B1 --output=avail / | tail -1)" -ge 60000000000
      - name: Install QEMU
        run: pacman -Syu --noconfirm --needed qemu-system-x86
      - name: Exercise KVM in the job container
        run: |
          test -c /dev/kvm
          printf 'info kvm\nquit\n' | timeout 20 qemu-system-x86_64 \
            -enable-kvm -machine q35 -cpu host -smp 1 -m 128 \
            -display none -nodefaults -S -monitor stdio >kvm.log 2>&1
          cat kvm.log
          grep -q 'kvm support: enabled' kvm.log
