# Subarchy's SDDM defaults (ADR 0030), installed to
# /usr/lib/sddm/sddm.conf.d/subarchy.conf. Override in /etc/sddm.conf.d/.
# The greeter runs inside Hyprland, like the session it starts.

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/subcult/default/sddm/hyprland.lua
SessionDir=/usr/share/wayland-sessions

[Users]
RememberLastUser=true
RememberLastSession=true

[Autologin]
Session=subarchy.desktop
