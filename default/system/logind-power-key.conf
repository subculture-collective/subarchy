# Subarchy: a short press of the power button does not turn the machine
# off. logind's default is an immediate poweroff, also from the lock
# screen, where it reads as a crash and shows the desktop for a moment as
# the session is torn down. The session binds the key to lock instead
# (default/hypr/bindings.lua); holding the button still powers off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
