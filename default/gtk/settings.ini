# Subarchy GTK defaults for GTK 3 and 4; the GSettings override holds the same.
# adw-gtk3 (adw-gtk-theme) draws GTK 3 and plain GTK 4 apps from libadwaita's
# named colours, which Pult's pult.css sets from the palette (ADR 0037);
# Adwaita's GTK 3 theme has its colours built in and ignores them.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=subcult-cursor
gtk-cursor-theme-size=24
gtk-font-name=Sans 11
