# Subarchy app catalogue (ADR 0044). Installed to /usr/share/subcult/default/apps.toml.
# Users add or change entries in ~/.config/subcult/apps.toml: an entry with the
# same id replaces this one; `remove = true` hides it.
#
# source: repo (Arch), aur (rebuilt in Subarchy's repository), mise, flatpak,
#         webapp (Chromium app window), build (not packaged yet)
# default_for: roles this app is the default for; one default per role.
# desktop: desktop file ID, used when setting it as a default.
# Desktop IDs marked "unverified" were not installed on sputnik when written.

schema = 1

# --- Core ---------------------------------------------------------------
[[app]]
id = "kitty"
name = "kitty"
roles = ["terminal"]
default_for = ["terminal"]
preinstalled = true
source = "repo"
packages = ["kitty"]
desktop = "kitty.desktop"

[[app]]
id = "wezterm"
name = "WezTerm"
roles = ["terminal"]
source = "repo"
