# Subarchy's pam_faillock settings (ADR 0063). The installer copies this
# file to /etc/security/faillock.conf, which the pam package owns; edit it
# there. Arch's defaults (3 failures, 10 minutes) locked the account for
# the greeter and the lock screen after three typos. The account still locks
# after 10 failures in 15 minutes, for 2 minutes; a reboot clears the count.
deny = 10
unlock_time = 120
