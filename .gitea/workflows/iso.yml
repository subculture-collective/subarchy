name: iso

# Builds the live ISO, boots it in QEMU (issue #60), then installs from it
# into a VM disk and checks the installed system (issue #68). On pushes to main
# and on demand. Pull requests are turned off on Gitea and are verified on
# GitHub (.github/workflows/mirror-ci.yml), which has no ISO or VM job. Every
# branch is mirrored here, so an image or harness change can run before it
# merges: start this workflow by hand (workflow_dispatch) on its branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}

env:
  GOMAXPROCS: "4"

jobs:
  build:
    runs-on: subarchy-kvm
    timeout-minutes: 120
    steps:
      - name: Check disk reserve
        run: test "$(df -B1 --output=avail / | tail -1)" -ge 60000000000
      - name: Install checkout tools
        run: pacman -Syu --noconfirm --needed git nodejs
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the ISO and boot it
        run: |
          git config --global --add safe.directory "$PWD"
          tools/ci/build-iso.sh
      - name: Install from the ISO and check the installed system
        run: tools/ci/install-test.sh
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: iso-logs
          path: |
            build/makepkg.log
            build/offline-download.log
            build/iso-boot.log
            build/vm/*-serial.log
            build/vm/*.png
          retention-days: 7
          if-no-files-found: warn
      # Only when a run is started by hand: the image is 4.6 GB, and the
      # upload took the runner 45 minutes in which no other job could start.
      - uses: actions/upload-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          name: subarchy-iso
          path: build/iso/*.iso
          retention-days: 2
          if-no-files-found: error
