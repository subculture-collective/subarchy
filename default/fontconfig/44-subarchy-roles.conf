<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Subarchy font roles (shell and look design, "Fonts"). GTK, Qt, the shell
  and kitty ask for these generic names, never a family name.

  The file is numbered 44 so it runs before fontconfig's 45-latin and
  49-sansserif add a generic name to requests for a named family: an app
  that asks for "Arial" or "DejaVu Sans" is left alone. Each rule inserts
  its family just before the generic name (mode prepend), ahead of Noto's
  46-* preferences. The icon-only Symbols Nerd Font comes after Noto, so a
  missing role font falls back to a face with Latin text, not to icons.

  The user's choices, written by `subcult font set`, are included first, so
  their families end up ahead of these defaults.
-->
<fontconfig>
  <include ignore_missing="yes" prefix="xdg">subcult/fonts.conf</include>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font Propo</string>
      <string>Noto Sans</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Libertinus Mono</string>
      <string>Noto Serif</string>
    </edit>
  </match>
</fontconfig>
