log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 5m
  insecure: false
  labels:
    - subarchy-kvm:docker://archlinux:latest
cache:
  enabled: false
container:
  privileged: true
  # 4096 processes: pacstrap runs pacman as PID 1 of its own PID namespace,
  # where the two gpg helpers of every signature check stay unreaped until
  # pacman exits. The live image's 595 packages need about 1,250.
  options: --init --device=/dev/kvm --cpus=4 --memory=8g --memory-swap=8g --pids-limit=4096
  valid_volumes: []
  docker_host: "-"
