name: verify

# Pull requests are verified by .github/workflows/mirror-ci.yml on the GitHub
# organization copy (reported here as "GitHub CI / Mirror CI gate"); this
# workflow keeps verifying main after merge.
on:
  push:
    branches: [main]

# Bound worker pools to the job quota rather than the host CPU count.
env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  LP_NUM_THREADS: "2"
  UV_THREADPOOL_SIZE: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: make verify
        run: make verify

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Reap orphaned package-hook processes and leave room for build/render
      # threads. The runner default of 512 prevented even checkout from forking.
      options: --init --pids-limit=1024
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs pacman-contrib fakeroot hypridle librsvg imagemagick xorg-xcursorgen hyprcursor python lua python-pyte python-pillow ffmpeg ttf-dejavu qt6-multimedia power-profiles-daemon python-gobject
      - name: Check process budget
        run: |
          cat /sys/fs/cgroup/pids.current /sys/fs/cgroup/pids.max
          ps -eLo comm= | sort | uniq -c | sort -nr | head -10
      - uses: actions/checkout@v4
      - name: Build and check the package as a normal user
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          chown -R builder: "$PWD"
          su builder -c "git config --global --add safe.directory '$PWD' && make package"

  shell:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Reap orphaned package-hook processes and leave room for build/render
      # threads. The runner default of 512 prevented even checkout from forking.
      options: --init --pids-limit=1024
    steps:
      - name: Install Quickshell, Qt and the headless test tools
        run: |
          pacman -Syu --noconfirm --needed git make nodejs python python-gobject ffmpeg quickshell qt6-multimedia qt6-declarative sway grim imagemagick libnotify ttf-dejavu ttf-iosevkaterm-nerd libqalculate fd unicode-emoji wtype librsvg
          # Arch gives sway cap_sys_nice as a file capability, which a container
          # may not grant; without it the binary cannot start at all.
          setcap -r /usr/bin/sway
      - uses: actions/checkout@v4
      - name: Model tests, lint and widget index
        run: |
          git config --global --add safe.directory "$PWD"
          make shell-test shell-lint shell-index-check
          tools/test/dell-power-refresh.sh
          tools/test/lock-focus-test.sh
          python3 -m unittest discover -s tools/bluetooth -p 'test_*.py' -v
          tools/test/bluetooth-panel-test.sh build/bluetooth-preview
          tools/test/battery-panel-test.sh build/battery-preview
          for scale in 1 1.6 2; do
            QT_SCALE_FACTOR="$scale" tools/test/greeter-test.sh "build/greeter-preview/scale-$scale"
          done
      - name: Keep native greeter previews
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: greeter-preview
          path: build/greeter-preview/
          retention-days: 3
          if-no-files-found: warn
      - name: Keep native battery previews
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: battery-preview
          path: build/battery-preview/
          retention-days: 3
          if-no-files-found: warn
      - name: Keep native Bluetooth previews
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bluetooth-preview
          path: build/bluetooth-preview/
          retention-days: 3
          if-no-files-found: warn
      - name: Shell in a headless sway
        run: |
          useradd -m runner
          chown -R runner: "$PWD"
          su runner -c "git config --global --add safe.directory '$PWD' && tools/test/shell-headless.sh shell"
