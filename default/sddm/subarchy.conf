# Subarchy's SDDM defaults (ADR 0030), installed to
# /usr/lib/sddm/sddm.conf.d/subarchy.conf. Override in /etc/sddm.conf.d/.
# The greeter runs inside Hyprland, like the session it starts.

[General]
DisplayServer=wayland

[Theme]
Current=subarchy

[Wayland]
# Started outside systemd, Hyprland would start hyprland-session.target in
# the sddm user's manager, and with it graphical-session.target and the
# desktop's user services (the bar, idle, clipboard) on the greeter. The
# variables keep the greeter's compositor out of systemd.
CompositorCommand=env HYPRLAND_NO_SD_TARGET=1 HYPRLAND_NO_SD_VARS=1 start-hyprland -- --config /usr/share/subcult/default/sddm/hyprland.lua
SessionDir=/usr/share/wayland-sessions

[Users]
RememberLastUser=true
RememberLastSession=true

[Autologin]
Session=subarchy.desktop
