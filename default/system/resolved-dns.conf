# Subarchy DNS (ADR 0020), untrusted-network default: Quad9 over strict
# DNS-over-TLS; lookups fail rather than fall back to plaintext. Installed to
# /usr/lib/systemd/resolved.conf.d/50-subarchy.conf; override in
# /etc/systemd/resolved.conf.d/. Per-network trust is not implemented yet.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net 2620:fe::fe#dns.quad9.net
Domains=~.
DNSOverTLS=yes
DNSSEC=allow-downgrade
# .local names come from Avahi (mDNS); resolved's own mDNS and LLMNR stay off.
MulticastDNS=no
LLMNR=no
