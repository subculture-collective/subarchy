name: verify

on:
  push:
    branches: [main]
  pull_request:

# The runner allows 512 tasks; tools otherwise size their worker pools from
# the host's CPU count rather than the job's two-CPU quota.
env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  LP_NUM_THREADS: "2"
  UV_THREADPOOL_SIZE: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: make verify
        run: make verify

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs pacman-contrib fakeroot hypridle librsvg xorg-xcursorgen hyprcursor python lua python-pyte python-pillow ffmpeg ttf-dejavu qt6-multimedia
      - uses: actions/checkout@v4
      - name: Build and check the package as a normal user
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          chown -R builder: "$PWD"
          su builder -c "git config --global --add safe.directory '$PWD' && make package"

  shell:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Quickshell, Qt and the headless test tools
        run: |
          pacman -Syu --noconfirm --needed git make nodejs python ffmpeg quickshell qt6-multimedia qt6-declarative sway grim imagemagick libnotify ttf-dejavu libqalculate fd unicode-emoji wtype
          # Arch gives sway cap_sys_nice as a file capability, which a container
          # may not grant; without it the binary cannot start at all.
          setcap -r /usr/bin/sway
      - uses: actions/checkout@v4
      - name: Model tests, lint and widget index
        run: |
          git config --global --add safe.directory "$PWD"
          make shell-test shell-lint shell-index-check
      - name: Shell in a headless sway
        run: |
          useradd -m runner
          chown -R runner: "$PWD"
          su runner -c "git config --global --add safe.directory '$PWD' && tools/test/shell-headless.sh shell"
