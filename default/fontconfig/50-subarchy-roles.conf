<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Subarchy font roles (shell and look design, "Fonts"). GTK, Qt, the shell
  and kitty ask for these aliases, never a family name. prepend_first puts
  the role's family ahead of every other preference (Noto's 46-* files,
  60-latin), whatever order the files load in. `subcult font set` writes
  ~/.config/fontconfig/conf.d/60-subcult-fonts.conf the same way; it runs
  later, so it wins. Symbols Nerd Font and Noto fill missing glyphs.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>Symbols Nerd Font Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>JetBrainsMono Nerd Font Propo</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Libertinus Mono</string>
      <string>Noto Serif</string>
    </edit>
  </match>
</fontconfig>
