# Subarchy kitty defaults. Put your own settings in ~/.config/kitty/kitty.conf;
# kitty reads this file only when you have none.
# `monospace` is the fontconfig alias that `subcult font set` changes.
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.0

window_padding_width 0
hide_window_decorations yes
cursor_shape block
confirm_os_window_close 0

include subcult-ink.conf
