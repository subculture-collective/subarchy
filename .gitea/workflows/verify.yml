name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: make verify
        run: make verify

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs pacman-contrib fakeroot
      - uses: actions/checkout@v4
      - name: Build and check the package as a normal user
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          chown -R builder: "$PWD"
          su builder -c "git config --global --add safe.directory '$PWD' && make package"
