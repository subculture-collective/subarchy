services:
  runner:
    image: docker.io/gitea/act_runner@sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86
    container_name: subarchy-kvm-runner
    restart: unless-stopped
    stop_grace_period: 6m
    environment:
      CONFIG_FILE: /config.yaml
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
